<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Temperature Converter</title>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 16px;
        }

        .units {
            margin: 15px 0;
            text-align: left;
        }

        .units label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .units select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 48%;
            padding: 12px;
            margin: 10px 1%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .convert-btn {
            background-color: #007bff;
            color: white;
        }

        .reset-btn {
            background-color: #ff4757;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Temperature Converter</h1>
        <input type="number" id="temperature" placeholder="Enter temperature...">

        <div class="units">
            <label for="fromUnit">From:</label>
            <select id="fromUnit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <div class="units">
            <label for="toUnit">To:</label>
            <select id="toUnit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button class="convert-btn" onclick="convertTemp()">Convert</button>
        <button class="reset-btn" onclick="clearValues()">Reset</button>

        <input type="text" id="result" readonly placeholder="Result will appear here...">
    </div>

<script>
    function convertTemp() {
        const temp = parseFloat(document.getElementById('temperature').value);
        const from = document.getElementById('fromUnit').value;
        const to = document.getElementById('toUnit').value;
        const resultOut = document.getElementById('result');

        if (isNaN(temp)) {
            alert("Please enter a valid temperature.");
            return;
        }

        if (from === to) {
            resultOut.value = temp.toFixed(2) + getUnitSymbol(to);
            return;
        }

        let celsius;
        if (from === 'celsius') celsius = temp;
        else if (from === 'fahrenheit') celsius = (temp - 32) * 5/9;
        else if (from === 'kelvin') celsius = temp - 273.15;
        let finalValue;
        if (to === 'celsius') finalValue = celsius;
        else if (to === 'fahrenheit') finalValue = (celsius * 9/5) + 32;
        else if (to === 'kelvin') finalValue = celsius + 273.15;

        resultOut.value = finalValue.toFixed(2) + getUnitSymbol(to);
    }

    function getUnitSymbol(unit) {
        if (unit === 'celsius') return " °C";
        if (unit === 'fahrenheit') return " °F";
        if (unit === 'kelvin') return " K";
    }

    function clearValues() {
        document.getElementById('temperature').value = '';
        document.getElementById('result').value = '';
        document.getElementById('fromUnit').selectedIndex = 0;
        document.getElementById('toUnit').selectedIndex = 0;
    }
</script>
</body>
</html>
